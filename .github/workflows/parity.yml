name: parity

# nb against the runner's brew on the same formulae. Weekly once the
# repository is public (the schedule is skipped while it is private, as
# macOS minutes are paid there); by hand at any time.
on:
  schedule:
    - cron: '23 5 * * 0'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A schedule's event says nothing of the repository, so ask.
  public:
    name: public?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      public: ${{ steps.ask.outputs.public }}
    steps:
      - name: Ask GitHub
        id: ask
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "public=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private | not')" >> "$GITHUB_OUTPUT"

  parity:
    name: macos-arm64
    needs: public
    if: github.event_name == 'workflow_dispatch' || needs.public.outputs.public == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: macos-latest

      - name: Homebrew version
        run: brew --version

      # One at a time: the tests share the runner's Homebrew, which locks
      # per install.
      - name: Parity tests
        env:
          NB_PARITY_REQUIRE_BREW: '1'
        run: cargo test --locked --package nb_cli --features parity --test parity -- --nocapture --test-threads=1 --skip install_timings
