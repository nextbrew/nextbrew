name: Build

# The release binaries, built for every pull request and push as for a
# release so a broken target shows before a tag. release.yml publishes them.
on:
  workflow_call:
    inputs:
      full:
        description: All four targets; otherwise Linux x64 only (no macOS or Arm minutes)
        required: false
        type: boolean
        default: true
      release:
        description: Build for a release (no cache, longer artifact retention)
        required: false
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Linux on 22.04 for an older glibc than ubuntu-latest's.
      matrix: ${{ fromJSON(inputs.full && '{"include":[
          {"target":"aarch64-apple-darwin","os":"macos-latest","name":"darwin-arm64"},
          {"target":"x86_64-apple-darwin","os":"macos-latest","name":"darwin-x64"},
          {"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04","name":"linux-x64"},
          {"target":"aarch64-unknown-linux-gnu","os":"ubuntu-22.04","name":"linux-arm64"}]}'
        || '{"include":[
          {"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04","name":"linux-x64"}]}') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}
          cache: ${{ !inputs.release }}

      - name: Install the Linux Arm64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          LZMA_API_STATIC: '1'
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        run: cargo build --release --locked --target "$TARGET" --package nb_cli

      - name: Check for no dynamic liblzma (macOS)
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          otool -L "target/$TARGET/release/nb"
          if otool -L "target/$TARGET/release/nb" | grep -Eq '/opt/homebrew|/usr/local/opt|liblzma'; then
            echo "::error::unexpected dynamic dependency in the release binary"
            exit 1
          fi

      - name: Name the binaries
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
        run: |
          mkdir dist
          cp "target/$TARGET/release/nb" "dist/nb-$NAME"
          cp "target/$TARGET/release/nbx" "dist/nbx-$NAME"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nb-${{ matrix.name }}
          path: dist/*
          retention-days: ${{ inputs.release && 30 || 3 }}
          if-no-files-found: error
