name: CI Test

# What every pull request and push to main runs (pr.yml, main.yml).
on:
  workflow_call:
    inputs:
      full:
        description: macOS and Linux Arm64 too; Linux x64 only otherwise (their minutes are paid on a private repo)
        required: false
        type: boolean
        default: true

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache: 'false'

      - name: Check formatting
        run: cargo fmt --all -- --check

  # On macOS too: much of nextbrew is behind cfg(target_os = "macos").
  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache-key: ${{ matrix.os }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The integration tests install, run and remove real formulae (jq, curl,
  # ffmpeg, and jq built from source).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full && '["ubuntu-latest","ubuntu-24.04-arm","macos-latest","macos-15-intel"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ matrix.os }}

      - name: Unit tests
        run: cargo test --workspace --locked

      # nb services needs a user systemd, which a runner has no session for.
      - name: Start a user systemd
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"

      - name: Integration tests
        run: cargo test --package nb_cli --test integration --locked -- --ignored

      # The runner's Homebrew moves into nextbrew. Only the x64 Linux image
      # has one to spare: the macOS runner's holds many packages (parity.yml
      # migrates those).
      - name: Migrate from Homebrew
        if: matrix.os == 'ubuntu-latest'
        env:
          NEXTBREW_ROOT: ${{ runner.temp }}/nbmig
          NEXTBREW_PREFIX: ${{ runner.temp }}/nbmig-prefix
          NEXTBREW_AUTO_INIT: 'true'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install hello
          cargo build --locked --package nb_cli --bin nb
          ./target/debug/nb migrate --yes
          "$NEXTBREW_PREFIX/bin/hello"
          if brew list --formula hello; then echo "hello still in Homebrew"; exit 1; fi

  build:
    name: build
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      full: ${{ inputs.full }}
