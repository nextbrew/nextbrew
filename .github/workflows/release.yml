name: release

on:
  push:
    tags:
      - 'v*'

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    if: github.repository == 'nextbrew/nextbrew'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      full: true
      release: true

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          pattern: nb-*
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS

      - name: Attest the binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
