name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must be an existing tag, e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    if: github.repository == 'nextbrew/nextbrew'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: nb-darwin-arm64
            nbx_artifact_name: nbx-darwin-arm64

          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: nb-darwin-x64
            nbx_artifact_name: nbx-darwin-x64

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact_name: nb-linux-x64
            nbx_artifact_name: nbx-linux-x64

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact_name: nb-linux-arm64
            nbx_artifact_name: nbx-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Install Linux ARM64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build release binary
        env:
          LZMA_API_STATIC: "1"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        run: cargo build --release --locked --target ${{ matrix.target }} --package nb_cli

      - name: Verify no dynamic liblzma dependency (macOS)
        if: contains(matrix.target, 'apple-darwin')
        run: |
          otool -L target/${{ matrix.target }}/release/nb
          if otool -L target/${{ matrix.target }}/release/nb | grep -Eq '/opt/homebrew|/usr/local/opt|liblzma'; then
            echo "error: unexpected dynamic dependency detected in release binary"
            exit 1
          fi

      - name: Prepare binaries
        run: |
          cp target/${{ matrix.target }}/release/nb ${{ matrix.artifact_name }}
          cp target/${{ matrix.target }}/release/nbx ${{ matrix.nbx_artifact_name }}

      - name: Upload nb binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 7

      - name: Upload nbx binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nbx_artifact_name }}
          path: ${{ matrix.nbx_artifact_name }}
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: "nb*-*"
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd assets
          sha256sum -- * > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3.2.0
        with:
          subject-checksums: assets/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          draft: false
