name: timing

# Install times of this build against the newest release and brew. By hand:
# it needs a release to compare with, and macOS minutes are paid while the
# repository is private.
on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: timing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  timing:
    name: macos-arm64
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: macos-latest-release

      - name: Homebrew version
        run: brew --version

      - name: Download the last release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern nb-darwin-arm64 --output /tmp/nb-release
          chmod +x /tmp/nb-release
          /tmp/nb-release --version

      - name: Time installs
        env:
          NB_PARITY_REQUIRE_BREW: '1'
          NB_TIMING_BASELINE: /tmp/nb-release
          NB_TIMING_TABLE: /tmp/nb-timing.md
        run: |
          cargo test --release --locked --package nb_cli --features parity --test parity -- --nocapture install_timings
          cat /tmp/nb-timing.md >> "$GITHUB_STEP_SUMMARY"
