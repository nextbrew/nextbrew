name: homebrew-changes

# Spec chapter 6: once a day, run the whole Homebrew API through nextbrew's
# own parsers and open an issue when something turned up since the last run:
# a new key, cask artifact or step type, or a formula or cask nextbrew can no
# longer handle. Nothing is fixed automatically.
#
# The last run's report is kept in the actions cache and is what the next
# run compares with.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: homebrew-changes
  cancel-in-progress: false

jobs:
  report:
    name: report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: homebrew-changes

      - name: Fetch the API
        run: |
          mkdir -p api
          curl -fsSL --retry 3 -o api/formula.json https://formulae.brew.sh/api/formula.json
          curl -fsSL --retry 3 -o api/cask.json https://formulae.brew.sh/api/cask.json

      - name: Restore the last report
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: last-report.json
          key: homebrew-report-${{ github.run_id }}
          restore-keys: homebrew-report-

      - name: Report
        id: report
        run: |
          baseline=()
          if [ -f last-report.json ]; then
            baseline=(--baseline last-report.json --diff diff.md)
          else
            echo "no earlier report; this run sets the baseline"
          fi
          set +e
          cargo run --release --locked -p nb_io --example compat_report -- \
            api/formula.json api/cask.json "${baseline[@]}" > report.json
          status=$?
          set -e
          case $status in
            0) echo "new=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "new=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
          cp report.json last-report.json

      - name: Keep the report for the next run
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: last-report.json
          key: homebrew-report-${{ github.run_id }}

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-report
          path: |
            report.json
            diff.md
          if-no-files-found: ignore

      - name: Open an issue
        if: steps.report.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The daily run found these since the last one:"
            echo "$RUN_URL"
            echo
            cat diff.md
          } > body.md
          title="Homebrew API changes ($(date -u +%F))"
          # The label may not exist yet; open the issue without it then.
          gh issue create --title "$title" --body-file body.md --label homebrew-changes \
            || gh issue create --title "$title" --body-file body.md
