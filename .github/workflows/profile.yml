name: profile

# Where nextbrew's install time goes, next to zerobrew on the same runner:
# bench/clients.sh with NEXTBREW_TIMINGS=1, so install.log has a timestamped
# line per install phase, plus the start-up time of each binary.
on:
  workflow_dispatch:
    inputs:
      formulae:
        description: Formulae (space-separated)
        default: 'jq openssl@3 node ruby'

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  profile:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: macos-latest-release

      - name: Build nb
        env:
          LZMA_API_STATIC: '1'
        run: |
          cargo build --release --locked --package nb_cli --bin nb
          mkdir -p "$HOME/bin"
          cp target/release/nb "$HOME/bin/nb"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install zerobrew
        run: |
          curl -fsSL -o "$HOME/bin/zb" https://github.com/lucasgelfond/zerobrew/releases/download/v0.4.2/zb-darwin-arm64
          echo "c58b0167df1da80f7daf65caf3815150b1eaf369991867da9fe087155e3f98dc  $HOME/bin/zb" | shasum -a 256 -c -
          chmod +x "$HOME/bin/zb"

      - name: Run
        env:
          FORMULAE: ${{ inputs.formulae }}
        run: |
          read -ra formulae <<< "$FORMULAE"
          out="$RUNNER_TEMP/profile"
          TOOLS="nb zb" NEXTBREW_TIMINGS=1 bench/clients.sh "$out" "${formulae[@]}"
          for t in nb zb; do
            /usr/bin/time -p zsh -c "repeat 20 $t --version >/dev/null" 2>&1 | sed "s/^/$t --version x20: /"
          done | tee "$out/startup.txt"
          # How many links each tool leaves for one keg, and how long that takes.
          for t in nb:nextbrew zb:zerobrew; do
            "${t%%:*}" install openssl@3 >/dev/null 2>&1
            echo "$t links: $(find /opt/${t#*:} -type l | wc -l)"
          done | tee "$out/links.txt"
          python3 - <<'PY' | tee -a "$out/links.txt"
          import os, time
          d = "/opt/nextbrew/linkbench"
          os.makedirs(d)
          t = time.perf_counter()
          for i in range(6529):
              os.symlink(f"/opt/nextbrew/Cellar/x/1/share/man/man3/X{i}.3ssl", f"{d}/X{i}.3ssl")
          print(f"6529 symlinks: {(time.perf_counter() - t) * 1000:.0f}ms")
          PY
          grep -h '' "$out/results.tsv" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile
          path: ${{ runner.temp }}/profile
          if-no-files-found: error
